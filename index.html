<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Evalix — an AI response evaluation playground for testing, rating, and improving AI-generated answers.">
  <title>Evalix - AI Response Evaluator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img 
    src="https://raw.githubusercontent.com/ifeellikechiefkeefin2009-lang/Evalix/main/evalix-logo.png" 
    alt="Evalix Logo" 
    class="logo"
  >
  <h1>Train AI. Test AI. Improve AI</h1>

  <p>Put an AI response here and Evalix will evaluate it.</p>

  <label for="response" class="sr-only">AI response to evaluate</label>
  <textarea id="response" rows="8" cols="50" placeholder="Paste an AI response here..."></textarea>

  <br><br>

  <button id="evaluate">Evaluate response</button>
  <div id="result" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
